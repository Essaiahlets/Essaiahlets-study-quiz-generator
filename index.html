<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Quiz Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 25px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin-bottom: 10px;
      font-size: 34px;
    }

    .header p {
      color: #6b7280;
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #6b7280;
    }

    #quiz {
      display: none;
    }

    .question {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .question h3 {
      margin-bottom: 15px;
    }

    .choice {
      padding: 10px;
      margin: 7px 0;
      background: #f9fafb;
      border-radius: 8px;
    }

    .answer {
      margin-top: 12px;
      font-weight: bold;
    }

    .explanation {
      margin-top: 8px;
      color: #6b7280;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🧠 AI Study Quiz Generator</h1>
      <p>Generate study quizzes using Tether's QVAC SDK on-device.</p>
    </div>

    <div class="card">

      <label for="topic">Enter a study topic</label>

      <input
        id="topic"
        type="text"
        placeholder="Example: JavaScript"
      >

      <button id="generateBtn">
        Generate Quiz
      </button>

      <div id="status"></div>

    </div>

    <div id="quiz" class="card">

      <h2>Your Study Quiz</h2>

      <div id="quizContent"></div>

    </div>

    <div class="footer">
      Powered by QVAC SDK • AI runs locally/on-device
    </div>

  </div>

  <script>

    const generateBtn = document.getElementById("generateBtn");
    const topicInput = document.getElementById("topic");
    const status = document.getElementById("status");
    const quiz = document.getElementById("quiz");
    const quizContent = document.getElementById("quizContent");

    generateBtn.addEventListener("click", async () => {

      const topic = topicInput.value.trim();

      if (!topic) {
        status.textContent = "Please enter a study topic.";
        return;
      }

      generateBtn.disabled = true;
      status.textContent = "Generating quiz with QVAC...";
      quiz.style.display = "none";

      try {

        const { spawn } = require("child_process");

        const process = spawn("node", ["app.js", topic], {
          cwd: __dirname
        });

        let output = "";

        process.stdout.on("data", (data) => {
          output += data.toString();
        });

        process.stderr.on("data", (data) => {
          console.error(data.toString());
        });

        process.on("close", (code) => {

          generateBtn.disabled = false;

          if (code !== 0) {
            status.textContent = "Something went wrong while generating the quiz.";
            return;
          }

          status.textContent = "Quiz generated successfully!";

          quizContent.innerHTML = `
            <pre style="
              white-space: pre-wrap;
              font-family: Arial, sans-serif;
              line-height: 1.6;
            ">${escapeHtml(output)}</pre>
          `;

          quiz.style.display = "block";
        });

      } catch (error) {

        generateBtn.disabled = false;
        status.textContent = "Error: " + error.message;

      }

    });

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

  </script>

</body>
</html>
